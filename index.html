<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #25D366;
      --primary-hover: #128C7E;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Modern Card Container with Entry Animation */
    .product-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    /* Staggered animation delays for items */
    .product-card:nth-child(1) { animation-delay: 0.1s; }
    .product-card:nth-child(2) { animation-delay: 0.25s; }
    .product-card:nth-child(3) { animation-delay: 0.4s; }

    /* "WOW" Hover Effect */
    .product-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 20px 40px -15px rgba(56, 189, 248, 0.2);
    }

    /* Image Wrapper with Zoom Animation */
    .image-wrapper {
      width: 100%;
      height: 220px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 18px;
      position: relative;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .product-card:hover .product-img {
      transform: scale(1.08);
    }

    .product-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 20px;
    }

    /* Animated Glowing WhatsApp Button */
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    /* Button Shimmer Animation */
    .whatsapp-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent,
        rgba(255, 255, 255, 0.25),
        transparent
      );
      transform: rotate(30deg) translateX(-100%);
      transition: transform 0.8s ease;
    }

    .product-card:hover .whatsapp-btn::after {
      transform: rotate(30deg) translateX(100%);
    }

    .whatsapp-btn:hover {
      box-shadow: 0 6px 25px rgba(37, 211, 102, 0.5);
      transform: translateY(-2px);
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Exclusive Collection</h1>
    <p class="subtitle">Order directly via WhatsApp with instant support</p>
  </header>

  <div class="product-grid" id="productGrid">
    <!-- Products will be dynamically generated by code or added manually -->
  </div>

  <script>
    // YOUR PHONE NUMBER (Includes Qatar country code 974 or BD 880)
    const PHONE_NUMBER = "97412345678"; 

    // Dynamic automatic message generator so NO manual typing of %20 is ever required!
    function generateWhatsAppLink(productTitle) {
      const message = `Hi! I want to order the item: ${productTitle}`;
      return `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    // Example sample data (When connected to CMS, this pulls automatically)
    const sampleProducts = [
      { title: "Luxury Arabic Oud Perfume", price: "350 QAR", image: "https://picsum.photos/400/300?random=1" },
      { title: "Premium Leather Watch", price: "220 QAR", image: "https://picsum.photos/400/300?random=2" },
      { title: "Custom Designer Sunglasses", price: "180 QAR", image: "https://picsum.photos/400/300?random=3" }
    ];

    const grid = document.getElementById('productGrid');

    sampleProducts.forEach(prod => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="image-wrapper">
          <img src="${prod.image}" alt="${prod.title}" class="product-img">
        </div>
        <div class="product-title">${prod.title}</div>
        <div class="product-price">${prod.price}</div>
        <a href="${generateWhatsAppLink(prod.title)}" target="_blank" class="whatsapp-btn">
          <span>Order on WhatsApp</span>
        </a>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
