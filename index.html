<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QATAR ATV & TOYS GALLERY</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #25D366;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle { color: var(--text-muted); font-size: 1rem; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      animation: fadeInUp 0.6s ease forwards;
    }

    .product-card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 20px 40px -15px rgba(56, 189, 248, 0.25);
    }

    .image-wrapper {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-img { transform: scale(1.06); }

    .product-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }

    .product-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    .whatsapp-btn:hover {
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
      transform: translateY(-2px);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>QATAR ATV & TOYS GALLERY</h1>
    <p class="subtitle">Tap on any picture to view full screen & zoom in</p>
  </header>

  <div class="product-grid" id="productGrid">
    <p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">Loading products...</p>
  </div>

  <script>
    const PHONE_NUMBER = "97412345678"; // Replace with your WhatsApp number

    function generateWhatsAppLink(productTitle) {
      const message = `Hi! I want to order: ${productTitle}`;
      return `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    async function loadCMSProducts() {
      const grid = document.getElementById('productGrid');
      
      try {
        const response = await fetch('https://api.github.com/repos/tanjim2006/my-store/contents/products');
        
        if (!response.ok) {
          grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#94a3b8;">No products uploaded yet!</p>';
          return;
        }

        const files = await response.json();
        grid.innerHTML = ''; 

        for (const file of files) {
          if (file.name.endsWith('.md') || file.name.endsWith('.json')) {
            const rawData = await fetch(file.download_url);
            const content = await rawData.text();
            
            const titleMatch = content.match(/title_en:\s*"?([^"\n]+)"?/) || content.match(/title:\s*"?([^"\n]+)"?/);
            const priceMatch = content.match(/price:\s*"?([^"\n]+)"?/);
            const imageMatch = content.match(/image:\s*"?([^"\n]+)"?/);
            const descMatch = content.match(/description:\s*"?([^"\n]+)"?/);

            if (titleMatch) {
              const title = titleMatch[1];
              const price = priceMatch ? priceMatch[1] : '';
              const image = imageMatch ? imageMatch[1] : 'https://via.placeholder.com/400x300';
              const desc = descMatch ? descMatch[1] : '';

              const card = document.createElement('div');
              card.className = 'product-card';
              card.innerHTML = `
                <div class="image-wrapper">
                  <img src="${image}" alt="${title}" class="product-img">
                </div>
                <div class="product-title">${title}</div>
                ${desc ? `<div class="product-desc">${desc}</div>` : ''}
                <div class="product-price">PRICE ${price} QAR</div>
                <a href="${generateWhatsAppLink(title)}" target="_blank" class="whatsapp-btn">
                  <span>WhatsApp Us</span>
                </a>
              `;
              grid.appendChild(card);
            }
          }
        }
      } catch (err) {
        console.error("Error loading products:", err);
      }
    }

    loadCMSProducts();
  </script>
</body>
</html>
